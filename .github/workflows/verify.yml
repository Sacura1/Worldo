name: Verify Worldo
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts
      - run: cargo test --locked --manifest-path contracts/Cargo.toml
      - run: cargo build --locked --manifest-path contracts/Cargo.toml --target wasm32-unknown-unknown --release
      - uses: actions/upload-artifact@v4
        with:
          name: worldo-contract
          path: contracts/target/wasm32-unknown-unknown/release/worldo_economy.wasm
