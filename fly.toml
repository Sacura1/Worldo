app = "lowland-near"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  PUBLIC_URL = "https://lowland-near.fly.dev"
  LOCAL_DATA_DIR = "/data/worlds"
  ENABLE_MAINNET = "false"
  NEAR_NETWORK = "testnet"
  ENABLE_TESTNET = "true"
  NEAR_AUTH_MODE = "testnet-wallet"
  NEAR_RPC_URL = "https://test.rpc.fastnear.com"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[http_service.checks]]
  grace_period = "20s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[[mounts]]
  source = "lowland_data"
  destination = "/data"
